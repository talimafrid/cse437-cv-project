seed: 42
device: auto
paths:
  grozi: data/grozi
  planogram_fixes: data/gp180
  sku110k_raw: data/SKU110K_fixed
  sku110k_yolo: data/sku110k_yolo
  splits: splits
  models: models
  outputs: outputs
  index: outputs/index
  planograms: outputs/planograms
data:
  gp_n_images: 70
  gp_n_val: 20
  gp_val_forced:
  - s1_15
  - s2_3
  - s2_30
  - s2_143
  - s2_157
  - s3_111
  - s3_260
  - s5_55
  gp_exclude:
  - s2_29
  - s1_10
  - s2_26
  - s1_29
  - s2_136
  - s3_191
  - s3_2
  - s4_63
  openset_fraction: 0.2
  sku110k_test_subset: 500
  sku110k_resize: 1024
detector:
  base_model: yolo11s.pt
  weights: models/sku110k_yolo11s.pt
  train:
    imgsz: 640
    batch: 8
    time_hours: 1.5
    max_det: 1000
  predict:
    conf: 0.05
    iou: 0.5
    max_det: 1000
    scales:
    - 640
    shrink:
    - 1.0
    - 0.5
recognizer:
  backbone: siglip2_b
  backbones:
    resnet50:
      kind: cnn
      size: 320
    dinov2_b:
      kind: dinov2
      hf: facebook/dinov2-base
      size: 336
    siglip2_b:
      kind: siglip
      hf: google/siglip2-base-patch16-384
      size: 384
    clip_b16:
      kind: clip
      hf: openai/clip-vit-base-patch16
      size: 224
  batch_size: 32
  gallery_views: 8
  top_k: 5
  sift:
    max_features: 400
    ratio: 0.8
    ransac_px: 5.0
    crop_side: 320
    rerank_lambda: 0.1
    rerank_margin: 0.02
  openset:
    threshold: 0.5131
    coef:
    - 2.1230453530542768
    - 1.8360151337462287
    - 1.3021075866633225
    - 1.2273885020075783
    - -1.97705881520074
  verify:
    delta: 0.05
    min_inliers: 20
planogram:
  row_gap: 0.5
  gap_cost: 0.6
  row_gap_cost: 0.7
  unknown_cost: 0.5
  swap_ratio: 0.75
  end_cost: 0.1
violations:
  rate_min: 0.1
  rate_max: 0.2
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  ops:
  - swap
  - remove
  - insert
  - replace
latency:
  runs: 100
  warmup: 5
