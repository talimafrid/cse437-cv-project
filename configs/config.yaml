# ============================================================
# Project 5 - Retail Shelf Planogram Compliance
# Master Configuration File
# ============================================================

# --- Paths ---
paths:
  data_root: "data"
  sku110k:
    images: "data/sku110k/images"
    annotations: "data/sku110k/annotations"
  sku110k_yolo:
    root: "data/sku110k_yolo"    # Generated by convert_sku110k.py
  grozi:
    training: "data/grozi/Training"   # Gallery reference images
    testing: "data/grozi/Testing"     # In-store shelf images
    bboxes: "data/grozi/bb"           # Bounding box annotations
    planograms: "data/grozi/planos"   # Planogram definitions
  gp180:
    root: "data/gp180"

  # Output directories
  models: "models"
  outputs: "outputs"
  gallery_index: "outputs/gallery_index"

# --- F1: Detector (YOLOv8) ---
detector:
  model_name: "yolov8m.pt"          # Base model for fine-tuning
  weights: "models/sku110k_best.pt" # Trained weights (after your training)
  img_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 300

# --- F2/F3: Recognizer ---
recognizer:
  backbone: "resnet50"              # Options: resnet50, clip-vit-b32
  embedding_dim: 2048               # 2048 for ResNet50, 512 for CLIP
  similarity_metric: "cosine"       # cosine | euclidean
  match_threshold: 0.65             # Above = known SKU match
  reject_threshold: 0.40            # Below = flag as unknown
  crop_size: [224, 224]             # Input size for feature extractor
  batch_size: 64                    # Batch size for gallery indexing
  normalize_embeddings: true

# --- F4: Planogram Alignment ---
planogram:
  row_clustering: "y_center"        # Method to group detections into rows
  row_gap_ratio: 0.15               # Min vertical gap ratio to split rows
  alignment_method: "edit_distance" # edit_distance | hungarian
  costs:
    substitution: 1.0
    insertion: 1.0
    deletion: 1.0

# --- F5: Violation Injection ---
violations:
  mutation_rate: 0.15               # 10-20% of planogram entries modified
  operations: ["swap", "remove", "insert"]
  seed: 42                          # Reproducibility

# --- F6: Gallery Management ---
gallery:
  allow_duplicates: false
  auto_save: true
  index_file: "outputs/gallery_index/faiss.index"
  metadata_file: "outputs/gallery_index/metadata.json"

# --- Inference ---
inference:
  device: "cpu"                     # cpu | cuda | cuda:0
  max_time_per_image: 5.0           # seconds - project requirement
  num_workers: 4
